; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:nodemcu-32s]
platform = espressif32
board = nodemcu-32s
framework = arduino
lib_compat_mode = strict
lib_ldf_mode = chain
monitor_speed = 115200
; The firmware mounts LittleFS. Without this, `pio run -t uploadfs` builds a SPIFFS
; image instead and the mount fails at boot, taking the web UI and saved settings with it.
board_build.filesystem = littlefs
; Enhanced build flags for better performance and safety
build_flags =
    ; Request handlers serialise JSON on this task; 4096 is not enough headroom for it.
    -D CONFIG_ASYNC_TCP_STACK_SIZE=8192
    -D CONFIG_ASYNC_TCP_RUNNING_CORE=1
    -D CONFIG_ASYNC_TCP_MAX_ACK_TIME=5000
    -D PCF8574_LOW_LATENCY  ; Enable low latency mode for PCF8574
    -D CORE_DEBUG_LEVEL=3   ; Enable debug output
lib_deps = 
	xreef/PCF8574 library@^2.3.7
	esp32async/ESPAsyncWebServer@^3.7.6
	bblanchon/ArduinoJson@^7.0.4
